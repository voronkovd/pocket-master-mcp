[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocket-master-mcp"
version = "0.1.1"
description = "MCP server that lets an AI assistant control a Sonicake Pocket Master guitar processor over USB MIDI, plus offline firmware language tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dmitrii Voronkov" }]
keywords = ["mcp", "model-context-protocol", "midi", "sysex", "sonicake", "pocket-master", "guitar", "multi-effects", "claude", "lvgl", "firmware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
  "mcp>=1.2,<2",
  "mido>=1.3",
  "python-rtmidi>=1.5",
]

[project.optional-dependencies]
preview = ["pillow>=10", "numpy>=1.24"]
dev = ["pytest>=8", "pillow>=10", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/voronkovd/pocket-master-mcp"
Issues = "https://github.com/voronkovd/pocket-master-mcp/issues"
Changelog = "https://github.com/voronkovd/pocket-master-mcp/blob/main/CHANGELOG.md"

[project.scripts]
pocket-master-mcp = "pocket_master_mcp.server:main"
pocket-master-fw = "pocket_master_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_master_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "scripts/", "tools/", "README.md", "CHANGELOG.md",
           "CONTRIBUTING.md", "LICENSE", "server.json", "pyproject.toml"]
exclude = ["local/", "**/__pycache__", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
